name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Ruff
        run: uvx pre-commit run ruff-check --all-files --show-diff-on-failure
      - name: Lockfile matches pyproject.toml
        run: uvx poetry check --lock

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }}, ${{ matrix.resolution }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
        resolution: [highest]
        include:
          - { os: ubuntu-latest, python: "3.11", resolution: lowest-direct }
          - { os: windows-latest, python: "3.11", resolution: lowest-direct }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v7

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release
          github-token: ${{ github.token }}

      - name: Install package and test tools
        run: uv pip install --system --resolution ${{ matrix.resolution }} -e ".[exportify]" --group dev

      - name: Run tests
        run: python -m pytest -v -rs --cov --cov-report=xml --cov-report=term --junitxml=xunit-result.xml

      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          name: coverage
          path: |
            coverage.xml
            xunit-result.xml

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7

      - name: Take version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "Tag must look like v1.2.3, got $GITHUB_REF_NAME"; exit 1; fi
          sed -i "s/^version = \".*\"/version = \"$version\"/" pyproject.toml
          grep -q "^version = \"$version\"" pyproject.toml

      - name: Build
        run: uv build

      - name: Check package metadata
        run: uvx twine check --strict dist/*

      - name: Smoke test the built wheel in a clean environment
        run: |
          wheel=$(ls dist/*.whl)
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python "$wheel"
          /tmp/smoke/bin/python -c "from spotube import DownloadManager; DownloadManager(directory='/tmp/songs')"
          /tmp/smoke/bin/spotube --version
          code=0; /tmp/smoke/bin/spotube download https://example.com/not-a-playlist || code=$?; test "$code" -eq 2
          uv pip install --python /tmp/smoke/bin/python "${wheel}[exportify]"
          /tmp/smoke/bin/python -c "import playwright.sync_api; from spotube import exportify; assert exportify.is_available()"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}

  live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install package and test tools
        run: uv pip install --system -e ".[exportify]" --group dev
      - name: Check external services still behave as expected
        env:
          GENIUS_ACCESS_TOKEN: ${{ secrets.GENIUS_ACCESS_TOKEN }}
        run: python -m pytest -v -rs --live -m live

  analysis:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: coverage
      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Snyk dependency monitor
        continue-on-error: true
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: monitor
